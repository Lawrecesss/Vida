name: Publish

# Tag-triggered release to PyPI via Trusted Publishing (OIDC) — no API token
# is stored anywhere. PyPI must have a trusted publisher registered for this
# repository and this workflow filename; see .github/workflows/README.md.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    name: Test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        # Sample media lives in Git LFS and is not fetched here, so the tests
        # that need it skip. That is by design — they are written to skip.
        run: pytest -q

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10

      - name: Tag must match the version in pyproject.toml
        # Cheap guard against tagging a release without bumping the version,
        # which would otherwise fail late at upload with a confusing 400.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match pyproject version $version"
            exit 1
          fi
          echo "Releasing version $version"

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: No secrets in the artifacts
        # The repo carries a gitignored .env locally; make sure nothing of that
        # shape can ride along in a distribution.
        run: |
          if tar tzf dist/*.tar.gz | grep -E '(^|/)\.env$'; then
            echo "::error::.env is present in the sdist"
            exit 1
          fi
          echo "OK: no .env in the sdist"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vida-sdk
    permissions:
      # Mandatory for trusted publishing, and deliberately scoped to this job
      # alone rather than the whole workflow.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
