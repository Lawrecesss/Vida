[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vida-core"
version = "0.1.0"
description = "Video to transcript, through one OpenRouter key."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.6"]

[tool.hatch.build.targets.wheel]
packages = ["vida"]
