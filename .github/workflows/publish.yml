name: Publish

# Tag-triggered release to PyPI via Trusted Publishing (OIDC) — no API token
# is stored anywhere. PyPI must have a trusted publisher registered for this
# repository and this workflow filename; see .github/workflows/README.md.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    name: Test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          # The ffmpeg tests need the real sample media. Without this the
          # checkout leaves Git LFS pointer stubs and those tests skip.
          lfs: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # Pinned to the same exact release as the build job; see the note there.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install
        # --system targets the setup-python interpreter instead of creating a
        # venv, so ruff and pytest land on PATH for the steps below.
        run: uv pip install --system -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  smoke:
    name: Live API smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install
        run: uv pip install --system -e '.[dev]'

      - name: Secret must be configured
        # Checked in the shell, not with `if:` — the secrets context is not
        # available in step-level conditions. Without this the failure would
        # surface as a ConfigurationError deep inside a test, reading like a
        # code bug rather than a missing setting.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is not set in repository secrets."
            echo "Add it under Settings -> Secrets and variables -> Actions, or"
            echo "remove the smoke job if you do not want a live gate on releases."
            exit 1
          fi
          echo "Secret is present."

      - name: Check the shipped defaults are alive
        # Every other test stubs the network, so a withdrawn model slug is
        # invisible to them. This is the gate that would have stopped 0.1.0.
        # The SDK's own client retries 429/5xx with backoff, so transient
        # provider blips do not need retry logic here.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VIDA_LIVE_SMOKE: "1"
        run: pytest tests/test_live_smoke.py -q

  build:
    name: Build distributions
    needs: [test, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # setup-uv does not maintain a moving major tag past v7, so pin the
      # exact release rather than a major that does not resolve.
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Tag must match the version in pyproject.toml
        # Cheap guard against tagging a release without bumping the version,
        # which would otherwise fail late at upload with a confusing 400.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match pyproject version $version"
            exit 1
          fi
          echo "Releasing version $version"

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: No secrets in the artifacts
        # The repo carries a gitignored .env locally; make sure nothing of that
        # shape can ride along in a distribution.
        run: |
          if tar tzf dist/*.tar.gz | grep -E '(^|/)\.env$'; then
            echo "::error::.env is present in the sdist"
            exit 1
          fi
          echo "OK: no .env in the sdist"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vida-sdk
    permissions:
      # Mandatory for trusted publishing, and deliberately scoped to this job
      # alone rather than the whole workflow.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
