[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vida-sdk"
version = "0.1.2"
description = "Video to subtitles in any language — fast transcription, translation, and visual analysis with timestamps intact"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lin Htet Shein", email = "lhshein14@gmail.com" }]
keywords = ["video", "transcription", "translation", "subtitles", "whisper", "asr"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# ASR backends
groq = ["groq>=0.11"]
openai = ["openai>=1.40"]
local = ["faster-whisper>=1.0"]
# CUDA 12 runtime for the local backend's GPU path, for people who have an
# NVIDIA card. Deliberately outside `local` and `all`: it is ~1.4 GB of wheels
# that do nothing on a CPU-only or Apple machine. CTranslate2 4.x wants cuBLAS
# 12 and cuDNN 9 specifically, hence the upper bound.
cuda = ["nvidia-cublas-cu12>=12.3", "nvidia-cudnn-cu12>=9.0,<10"]
# LLM-backed translation / analysis providers
agent = ["langgraph>=0.2", "langchain-core>=0.3", "langchain-openrouter>=0.2"]
# Everything
all = [
    "groq>=0.11",
    "openai>=1.40",
    "faster-whisper>=1.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openrouter>=0.2",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]
# Word-error-rate scoring for the transcription accuracy harness in evals/asr.
# Not in `dev`: the unit suite never scores accuracy, and jiwer is only needed
# by someone actually running fixtures.
eval = ["jiwer>=3.0"]

[project.scripts]
vida = "vida.cli:main"

[project.urls]
Homepage = "https://github.com/Lawrecesss/Vida"

[tool.hatch.build.targets.wheel]
packages = ["vida"]

# The repo also carries the demo app (backend/, frontend/) and an LFS-tracked
# sample video in vids/. None of that belongs in a source distribution.
[tool.hatch.build.targets.sdist]
only-include = ["vida", "tests", "README.md", "LICENSE", ".env.example"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RET"]
ignore = [
    "B008",     # FastAPI's Depends/File defaults are the documented idiom
    "SIM105",   # contextlib.suppress is not clearer for one-line cleanups
    "E501",     # line length is enforced by the formatter
    "ASYNC240", # os.path joins are cheap; this project does not use trio/anyio paths
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
