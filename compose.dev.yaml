# Hot-reload overlay. Not usable alone:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build   (make dev)

services:
  backend:
    volumes:
      - ./vida:/app/vida
      - ./backend:/app/backend
      - uploads:/data/uploads
    # The same two watch directories run.py passes uvicorn outside Docker: the
    # SDK lives outside backend/, and uvicorn only watches the CWD by default,
    # so without the second one SDK edits stay invisible until a restart.
    command:
      - uvicorn
      - api.app:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/backend
      - --reload-dir=/app/vida

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      # Anonymous volumes, so the bind mount above cannot shadow the image's
      # install or push a container-built .next back onto the host.
      - /app/node_modules
      - /app/.next
    # `next dev` compiles on demand, so here NEXT_PUBLIC_API_URL is read from
    # the environment rather than from the build arg in compose.yaml.
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-8000}/api/v1}
